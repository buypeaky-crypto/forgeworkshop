<!doctype html>
<html>
<head>
<style>
  html, body { margin: 0; padding: 16px; background: #666; font-family: sans-serif; color: #fff; }
  .row { display: flex; gap: 24px; align-items: flex-end; }
  .cell { text-align: center; }
  .cell img { display: block; background: #fff; image-rendering: pixelated; }
  .s16 { width: 16px; height: 16px; }
  .s32 { width: 32px; height: 32px; }
  .s64 { width: 64px; height: 64px; }
</style>
</head>
<body>
  <div class="row">
    <div class="cell"><img class="s16" src="file:///workspace/public/favicon.svg"><div>16</div></div>
    <div class="cell"><img class="s32" src="file:///workspace/public/favicon.svg"><div>32</div></div>
    <div class="cell"><img class="s64" src="file:///workspace/public/favicon.svg"><div>64</div></div>
  </div>
</body>
</html>
